name: Deploy

# dev        -> testing subdomain
# production -> live site
# main       -> integration branch, never auto-deploys
#
# Runs on a self-hosted runner installed on each server. The server dials OUT
# to GitHub and picks the job up, instead of GitHub dialling IN over SSH.
# That removes every SSH secret, the host-key scan, and anything an inbound
# firewall or fail2ban could block - which is what made the SSH version fail
# intermittently. See docs/DEPLOYMENT.md for the one-time runner install.
on:
  push:
    branches: [dev, production]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [testing, production]
        required: true

# Two deploys to the same server at once would fight over the git checkout.
concurrency:
  group: deploy-${{ inputs.target || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    # The label picks the server: each runner is registered with `testing` or
    # `production`. Same expression as `environment` below - keep them in sync.
    #
    # If the matching runner is offline the job sits queued (GitHub gives up
    # after 24h) rather than failing - check Settings -> Actions -> Runners.
    runs-on:
      - self-hosted
      - "${{ inputs.target || (github.ref_name == 'production' && 'production' || 'testing') }}"

    # Add a required reviewer on the `production` environment in GitHub to make
    # live deploys need an approval click.
    environment: ${{ inputs.target || (github.ref_name == 'production' && 'production' || 'testing') }}

    timeout-minutes: 10

    steps:
      - name: Resolve branch for this environment
        id: target
        run: |
          # Derived from the environment, not from github.ref, so dispatching
          # "production" can never ship whatever branch you happened to be on.
          if [ "${{ inputs.target || github.ref_name }}" = "production" ]; then
            echo "branch=production" >> "$GITHUB_OUTPUT"
          else
            echo "branch=dev" >> "$GITHUB_OUTPUT"
          fi

      # Only .github is needed (deploy.sh lives there), and this checkout lands
      # in the runner's own workspace - a sparse one avoids keeping a second
      # full copy of this large legacy repo on the server.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check deploy path
        env:
          # A path is not a secret; `vars` keeps it readable in the log instead
          # of masked as ***. The secret is still honoured so existing setups
          # keep working without being re-entered.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_PATH" ]; then
            echo "::error::DEPLOY_PATH is not set for this environment."
            echo ""
            echo "Add it under: Settings -> Environments -> (testing|production)"
            echo "              -> Environment variables"
            echo ""
            echo "  DEPLOY_PATH   /home/<user>/htdocs/<domain>"
            echo ""
            echo "Full walkthrough: docs/DEPLOYMENT.md, section 3."
            exit 1
          fi
          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            # The runner is on the server, so this is checkable up front rather
            # than surfacing as a confusing failure inside deploy.sh.
            echo "::error::$DEPLOY_PATH is not a git checkout on this runner."
            echo "Either the path is wrong, or this runner is registered to the"
            echo "wrong server. Run the one-time setup in docs/DEPLOYMENT.md."
            exit 1
          fi
          echo "Deploying into $DEPLOY_PATH"

      - name: Deploy
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: bash .github/scripts/deploy.sh "$DEPLOY_PATH" "$BRANCH"

      - name: Health check
        # Accepts either a variable or a secret. A URL is not sensitive, so a
        # variable is preferable (it stays readable in the log instead of being
        # masked as ***) - but reading both means putting it in the wrong place
        # does not silently skip the check, which is how this was first missed.
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL not set for this environment - skipping health check."
            echo "Set it under Settings -> Environments -> (testing|production)"
            echo "so a deploy that leaves the site 500ing is reported as failed."
            exit 0
          fi
          # A deploy that returns 500 is a failed deploy, even if git succeeded.
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK: $SITE_URL returned 200"
              exit 0
            fi
            echo "attempt $i: got HTTP $code, retrying..."
            sleep 5
          done
          echo "FAILED: $SITE_URL never returned 200 (last: $code)"
          exit 1
